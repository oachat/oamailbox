<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人机验证</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/sitekey.js" async defer></script>
    <style>
        :root {
            --tg-theme-bg-color: #17212b;
            --tg-theme-text-color: #ffffff;
            --tg-theme-button-color: #5288c1;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-secondary-bg-color: #232f3d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--tg-theme-secondary-bg-color);
            margin: 0 auto 15px;
            background-size: cover;
            background-position: center;
        }
        .title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .desc {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 30px;
        }
        .status {
            margin-top: 20px;
            font-size: 14px;
        }
        .error {
            color: #ff4444;
        }
        .success {
            color: #44dd44;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar" id="avatar"></div>
        <div class="title">请先完成人机验证~</div>
        <div class="desc">通过验证后即可继续对话</div>
        
        <div class="cf-turnstile"
             data-sitekey="0x4AAAAAAADPby8fiJUYElmcE"
             data-callback="onTurnstileSuccess"
             data-error-callback="onTurnstileError">
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const API_BASE = params.get("api_base") || "https://tgbotoa.oachat66.workers.dev";
        const PREFIX = params.get("prefix") || "Oachatbot";
        const API_URL = `${API_BASE}/${PREFIX}/api/verify`;

        let tg = null;
        let initData = null;

        // 初始化 Telegram Web App
        window.addEventListener('load', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.expand();
                initData = tg.initData;

                // 设置主题色
                document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#17212b');
                document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#ffffff');
                document.documentElement.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color || '#5288c1');
                document.documentElement.style.setProperty('--tg-theme-button-text-color', tg.themeParams.button_text_color || '#ffffff');
                document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', tg.themeParams.secondary_bg_color || '#232f3d');

                // 显示用户信息
                const user = tg.initDataUnsafe?.user;
                if (user) {
                    document.querySelector('.title').textContent = `你好，${user.first_name}！`;
                    const avatarEl = document.getElementById('avatar');
                    if (user.photo_url) {
                        avatarEl.style.backgroundImage = `url(${user.photo_url})`;
                    }
                }
            } else {
                document.getElementById('status').textContent = '请在 Telegram 中打开';
                document.getElementById('status').classList.add('error');
            }
        });

        // 验证成功回调
        function onTurnstileSuccess(token) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = '正在验证...';

            fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    initData: initData,
                    turnstileToken: token
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    statusEl.textContent = '验证通过！2秒后自动关闭...';
                    statusEl.classList.add('success');
                    setTimeout(() => {
                        tg.close();
                    }, 2000);
                } else {
                    statusEl.textContent = data.error || '验证失败，请重试';
                    statusEl.classList.add('error');
                }
            })
            .catch(err => {
                statusEl.textContent = '网络错误，请重试';
                statusEl.classList.add('error');
                console.error(err);
            });
        }

        // 验证失败回调
        function onTurnstileError(errorCode) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = '验证出错，请刷新重试';
            statusEl.classList.add('error');
            console.error('Turnstile error:', errorCode);
        }
    </script>
</body>
</html>
