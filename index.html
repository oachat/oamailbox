<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>oa的传话筒</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    @font-face {
	 font-family: LxovoFont;
	 src: url(https://npm.elemecdn.com/ethan4116-blog/lib/font/ZhuZiAWan.ttf);
	 font-weight: 400;
	 font-style: normal;
	 font-display: swap
   }
    :root {
      --bg: var(--tg-theme-bg-color, #17212b);
      --fg: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #a0a0a0);
      --card: var(--tg-theme-secondary-bg-color, #2b2d31);
      --ok: #4cd964;
      --err: #ff3b30;
      --border: rgba(255,255,255,.1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: LxovoFont, sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding: 20px;
    }
    .card {
      max-width: 400px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px 24px;
      background: var(--card);
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .title { font-size: 22px; margin-bottom: 10px; }
    .desc { color: var(--hint); font-size: 14px; margin-bottom: 25px; }
    .turnstile-box { display: flex; justify-content: center; margin-top: 10px; }
    .msg { margin-top: 20px; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
<div class="card">
  <div class="title">请先完成人机验证</div>
  <div class="desc">通过验证后即可继续与 oa 对话</div>

  <div class="turnstile-box">
    <div
      class="cf-turnstile"
      data-sitekey="0x4AAAAAAADPby8fiJUYElmcE"
      data-callback="onTurnstileSuccess"
      data-error-callback="onTurnstileError"
    ></div>
  </div>
  <div id="message" class="msg"></div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (!tg) {
    document.getElementById("message").innerText = "请在 Telegram 中打开";
    return;
  }
  tg.ready();
  tg.expand();

  // ======================
  // 你的配置（已帮你填好）
  // ======================
  const API_BASE = "https://tgbotoa.oachat6.workers.dev";
  const PREFIX = "Oachatbot";
  const API_URL = `${API_BASE}/${PREFIX}/api/verify`;

  function showMsg(text, isError = false) {
    const el = document.getElementById("message");
    el.innerText = text;
    el.style.color = isError ? "var(--err)" : "var(--ok)";
  }

  async function onTurnstileSuccess(token) {
    showMsg("验证中...");
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          initData: tg.initData,
          turnstileToken: token
        })
      });
      const data = await res.json();
      if (data.success) {
        showMsg("验证成功！即将关闭…");
        setTimeout(() => tg.close(), 1600);
      } else {
        showMsg("验证失败：" + data.error, true);
      }
    } catch (e) {
      showMsg("网络错误，请重试", true);
    }
  }

  function onTurnstileError() {
    showMsg("验证出错，请刷新重试", true);
  }
</script>
</body>
</html>
