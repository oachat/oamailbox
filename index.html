<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oa验证</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body{margin:0;background:#17212b;color:#fff;font-family:Arial;padding:20px;display:flex;justify-content:center;align-items:center;height:100vh;box-sizing:border-box}
    .box{max-width:380px;width:100%;background:#222;border-radius:16px;padding:24px;text-align:center}
    .title{font-size:20px;margin-bottom:8px}
    .desc{color:#aaa;font-size:14px;margin-bottom:20px}
    #msg{margin-top:16px;font-size:14px}
    .cf-turnstile{display:flex;justify-content:center}
  </style>
</head>
<body>
<div class="box">
  <div class="title">完成验证即可继续</div>
  <div class="desc">与 oa 对话</div>
  <div class="cf-turnstile"
    data-sitekey="0x4AAAAAAADPby8fiJUYElmcE"
    data-callback="ok"
    data-error-callback="err">
  </div>
  <div id="msg"></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

function msg(text, isErr){
  document.getElementById("msg").innerText = text;
  document.getElementById("msg").style.color = isErr ? "#ff5555" : "#4cd964";
}

async function ok(token){
  msg("验证中...");
  try {
    const res = await fetch("https://tgbotoa.oachat6.workers.dev/Oachatbot/api/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: tg?.initData, turnstileToken: token })
    });
    const data = await res.json();
    if (data.success) {
      msg("验证成功！关闭中...");
      setTimeout(() => tg?.close(), 1500);
    } else {
      msg("失败：" + data.error, true);
    }
  } catch(e) {
    msg("网络错误", true);
  }
}

function err(){
  msg("验证出错，请重试", true);
}
</script>
</body>
</html>
